# Colab（L4）で DL（方策と価値の 2 つの頭を持つネットワーク、M11）を学習する設定のひな形。
# 使うときは、このファイルをコピーして、<…> の目印を自分の環境の値に書き換える。
#   <学習データのフォルダ>：学習用の PSV（*.psv）が置いてあるフォルダ（Google Drive 上のパス）
#   <出力のフォルダ>：学習の出力（checkpoint.pt・log.jsonl・status.json）を置くフォルダ
# <…> が残っていると、学習器は「設定のひな形のまま」と言って何も書かずに止まる。
# 学習の値（バッチ・学習率・ステップ数など）は、実測（tools/shk_speedcheck_dl.py）に合わせて調整してよい。
#
# 1 回 8 時間の運用：max_minutes = 480 で、8 時間たったら保存して正常に終わる。続きは --resume（ノートブックの再開）。
# total_steps・max_steps は、L4 で 5 万局面/秒なら 8 時間で約 14 億局面 ≈ 35 万ステップ（バッチ 4096）。
# 学習率の減衰（コサイン）は total_steps に合わせて進むので、途中で止まる場合は total_steps を実測の見込みに合わせる。

[data]
# 学習用の PSV。周回ごとに、ファイルの順番を seed + 周回番号 で並べ替えて読む。
train_glob = "/content/drive/MyDrive/<学習データのフォルダ>/*.psv"
# 検証用の PSV（任意）。学習に使わないファイルを 1 つ用意して指定する。空なら psv の検証はしない。
val_path = ""
# Dainagon のテストセット（hcpe、任意）。空なら hcpe の検証はしない。
val_hcpe_glob = ""
cache_dir = "/content/shk_cache"
max_cached = 3
shuffle_buffer = 20000000
num_threads = 11

[model]
# プリセット：A（幅重視）・B（深さ重視）・X2（約 2 倍の大きさ）。名前を直接書いてもよい（例：dl_192_SHHHHT_H_HH）。
network = "dl_192_SHHHHT_H_HH"

[train]
optimizer = "adamw"
batch_size = 4096
lr = 4e-4
weight_decay = 1e-3
warmup_steps = 2000
total_steps = 350000
max_steps = 350000
min_lr_ratio = 0.01
eval_scale = "auto"
scale_sample = 10000000
value_mix_lambda = 0.5
value_loss_scale = 1.5
label_smoothing = 0.03
grad_clip = 1.0
amp = "bf16"
compile = true
channels_last = true
device = "auto"
seed = 0
save_every_minutes = 30.0
max_minutes = 480
val_every_steps = 0
val_positions = 100000
log_every_steps = 100
progress_every_sec = 30.0

[output]
out_dir = "/content/drive/MyDrive/<出力のフォルダ>/runs/colab_dl_A"
